[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"
  VITE_SITE_URL = "https://www.shakespeareonthesound.org"
  # Preview site (Netlify) — use this URL to QA until the custom domain is pointed here
  # https://ubiquitous-maamoul-8b9b7f.netlify.app
  SITE_ALLOWED_ORIGINS = "https://www.shakespeareonthesound.org,https://shakespeareonthesound.org,https://ubiquitous-maamoul-8b9b7f.netlify.app"

[[redirects]]
  from = "/api/content"
  to = "/.netlify/functions/content"
  status = 200

[[redirects]]
  from = "/api/content-admin"
  to = "/.netlify/functions/content-admin"
  status = 200

[[redirects]]
  from = "/api/admin-auth"
  to = "/.netlify/functions/admin-auth"
  status = 200

[[redirects]]
  from = "/api/tickets"
  to = "/.netlify/functions/tickets"
  status = 200

[[redirects]]
  from = "/api/eventbrite-webhook"
  to = "/.netlify/functions/eventbrite-webhook"
  status = 200

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

# SPA fallback — must be last (see public/_redirects for static assets + API routes)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# —— Security headers (public site) ——
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-DNS-Prefetch-Control = "on"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-site"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://www.paypal.com https://www.eventbrite.com; upgrade-insecure-requests; script-src 'self' https://cdn.feedbucket.app https://www.eventbrite.com https://www.eventbriteapi.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.feedbucket.app; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.feedbucket.app https://*.feedbucket.com https://www.eventbrite.com https://www.eventbriteapi.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://www.google.com https://maps.google.com https://*.feedbucket.app https://www.eventbrite.com https://www.eventbriteapi.com; manifest-src 'self'"

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/api/tickets"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=300, stale-while-revalidate=600"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=300, stale-while-revalidate=600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"
